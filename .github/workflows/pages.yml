name: Deploy StickMotion Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run scene planner tests
        run: npm test
      - name: Check Python voice generator syntax
        run: python -m py_compile scripts/generate_voice.py scripts/generate_gemini_voice.py scripts/render_video.py tests/test_generate_voice.py tests/test_generate_gemini_voice.py
      - name: Test voice input validation
        run: |
          python tests/test_generate_voice.py
          python tests/test_generate_gemini_voice.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
