name: Render StickMotion 60-second MP4 pilot
on:
  push:
    branches: [reference-style-animation]
  workflow_dispatch:
    inputs:
      narration:
        description: English narration for a short pilot (1–1,800 characters; keep near 60 seconds)
        required: true
        type: string
      voice:
        description: Gemini documentary narrator
        required: true
        default: Charon
        type: choice
        options:
          - Charon
          - Iapetus
          - Rasalgethi
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow imageio-ffmpeg google-genai
      - name: Validate and save narration
        env:
          NARRATION: ${{ inputs.narration || 'In the winter of nineteen sixteen, a young messenger entered a crowded railway station near Verdun. He carried a sealed letter through the noise and smoke. Outside, exhausted soldiers waited beside a train bound for the front. Inside, an officer opened the letter and read the news in silence. By morning, the station had become a place of fear and hurried departures.' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          text=os.environ.get("NARRATION","").strip()
          if not text or len(text)>1800:
              raise SystemExit(f"Pilot narration must be 1–1,800 characters; got {len(text)}.")
          Path("output").mkdir(exist_ok=True)
          Path("output/narration.txt").write_text(text,encoding="utf-8")
          PY
      - name: Generate Charon narration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE: ${{ inputs.voice || 'Charon' }}
        run: |
          python scripts/generate_gemini_voice.py --input output/narration.txt --output output/narration.wav --voice "$VOICE" --style "Measured, warm, authoritative documentary narration. Natural pacing, clear articulation, restrained emotion. Avoid an exaggerated announcer style." --model gemini-2.5-flash-preview-tts
      - name: Load approved Memorial de Verdun character reference when present
        run: |
          mkdir -p output/scenes assets/references
          if [ -f assets/references/memorial-verdun.png ]; then
            python - <<'PY'
          from PIL import Image
          Image.open("assets/references/memorial-verdun.png").convert("RGB").save("output/scenes/character-reference.jpg", "JPEG", quality=94)
          PY
          elif [ -f assets/references/memorial-verdun.jpg ]; then
            python - <<'PY'
          from PIL import Image
          Image.open("assets/references/memorial-verdun.jpg").convert("RGB").save("output/scenes/character-reference.jpg", "JPEG", quality=94)
          PY
          else
            echo "Approved Memorial de Verdun image is not in assets/references yet; using the generated lead-character crop for this pilot."
          fi
      - name: Generate AI scene artwork when Cloudflare credentials are configured
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            python scripts/generate_scene_images.py --narration output/narration.txt --output-dir output/scenes --max-images 30
          else
            echo "Cloudflare image secrets not configured; renderer will use its local illustrated fallback."
          fi
      - name: Render animated MP4 with subtitles
        run: python scripts/render_video.py --narration output/narration.txt --voice output/narration.wav --output output/stickmotion-pilot.mp4
      - name: Upload MP4, SRT and render metadata
        uses: actions/upload-artifact@v4
        with:
          name: stickmotion-mp4-pilot
          path: |
            output/stickmotion-pilot.mp4
            output/stickmotion-pilot.srt
            output/stickmotion-pilot.json
            output/narration.wav
            output/music.wav
            output/sfx.wav
            output/narration.txt
            output/scenes/*.png
          retention-days: 3
